# Entorno local: registry + entrenamiento + API (Hito 3) + orquestación (Hito 5).
#
#   python tasks.py mlflow     # levanta sólo MLflow   → http://127.0.0.1:5000
#   python tasks.py train      # entrena EN CONTENEDOR y registra (sin promover)
#   python tasks.py promover ocupados 1
#   python tasks.py up         # API                   → http://127.0.0.1:8000/docs
#   python tasks.py airflow    # Airflow               → http://127.0.0.1:8080
#
# Los puertos se publican sólo en 127.0.0.1: el servidor de MLflow no tiene
# autenticación, y publicarlo en 0.0.0.0 lo expone a toda tu red local.

name: ml-predict-income

# ------------------------------------------------------------------ Airflow (Hito 5)
# Basado en el docker-compose oficial de Airflow 3.3.2, recortado a lo que este proyecto
# usa. Diferencias deliberadas con el oficial:
#   · LocalExecutor en vez de Celery: sin Redis ni workers. Las tareas corren dentro del
#     scheduler, y como el cómputo pesado va en contenedores aparte (DockerOperator),
#     el scheduler sólo espera. Celery se justifica con muchas tareas en paralelo.
#   · Sin triggerer: sólo hace falta para operadores "deferrable", y no usamos ninguno.
#   · Secretos en .env (lo genera `python tasks.py airflow`, está en .gitignore), no
#     valores fijos en este archivo.
#   · Todo bajo el perfil `airflow`: `tasks.py up` no lo arranca. Airflow pide ~2–3 GB de
#     RAM y no hace falta para servir.
x-airflow: &airflow
  image: apache/airflow:3.3.2
  profiles: ["airflow"]
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    # Las tareas le reportan su estado al api-server por esta URL (Airflow 3).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Mexico_City
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Lo que leen los DAGs (airflow/dags/reentrenar.py). Configuración aquí, no en el código.
    ML_DOCKER_URL: tcp://docker-proxy:2375
    ML_IMAGEN_ENTRENAMIENTO: ml-predict-income-train:dev
    ML_RED_DOCKER: ml-predict-income_default
    ML_VOLUMEN_DATOS: ml-predict-income-datos
    ML_VOLUMEN_CRUDOS: ml-predict-income-crudos
    ML_MLFLOW_URI: http://mlflow:5000
  volumes:
    # Los DAGs se montan en SÓLO LECTURA: Airflow los lee, nunca los escribe.
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depende
    airflow-postgres: {condition: service_healthy}

services:
  mlflow:
    build: ./docker/mlflow
    image: ml-predict-income-mlflow:3.16.1
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    restart: unless-stopped

  train:
    build:
      context: .
      target: train
      # El commit queda DENTRO de la imagen: cuando el DAG la use, las corridas de MLflow
      # sabrán de qué código salió el modelo aunque ahí no haya git.
      args: {GIT_SHA: "${GIT_SHA:-desconocido}"}
    image: ml-predict-income-train:dev
    profiles: ["train"]            # no arranca con `up`: sólo con `run`
    depends_on:
      mlflow: {condition: service_healthy}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_SHA: ${GIT_SHA:-desconocido}
    # Sólo lectura: entrenar no debe poder modificar los datos de los que aprende.
    volumes: ["./data/processed:/app/data/processed:ro"]

  api:
    build: {context: ., target: runtime}
    image: ml-predict-income:${TAG:-dev}
    depends_on:
      mlflow: {condition: service_healthy}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      # Por omisión el cliente de MLflow reintenta 7 veces con espera exponencial:
      # varios minutos antes de rendirse. Al arrancar se prefiere fallar rápido y que
      # el orquestador reinicie.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "15"
    ports: ["127.0.0.1:${PORT:-8000}:8000"]
    # Las mismas restricciones que `docker run` usaba en el Hito 1.
    read_only: true
    tmpfs: ["/tmp:size=256m"]      # la caché del modelo vive aquí (MODEL_CACHE_DIR)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0

  # Llena los volúmenes que usan las tareas del DAG. Se corre con `python tasks.py preparar`.
  # Por qué volúmenes y no montar carpetas: las tareas las crea Airflow a través del API
  # de Docker, y ahí una ruta de Windows (D:\...) no significa nada.
  #   · crudos ← data/raw: los CSV de INEGI (cp -u: sólo lo nuevo; la 1ª vez ~840 MB).
  #   · datos  ← SÓLO las decisiones versionadas (features congeladas y partición). Desde
  #     el Hito 5b el parquet ya no se copia: lo construye el DAG desde el crudo.
  sembrar-datos:
    image: ml-predict-income-train:dev
    profiles: ["datos"]
    user: "0:0"                      # escribe en los volúmenes y se los cede al usuario app
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /app/data/raw
        && cp -ru /origen-crudos/. /app/data/raw/
        && cp /origen/features_ocupados.json /origen/features_no_ocupados.json
              /origen/split_upm_3way.csv /app/data/processed/
        && chown -R 10001:10001 /app/data
        && du -sh /app/data/raw && ls -la /app/data/processed
    volumes:
      - ./data/raw:/origen-crudos:ro
      - ./data/processed:/origen:ro
      - crudos:/app/data/raw
      - datos:/app/data/processed

  # ---------------------------------------------------------------- Airflow
  # Airflow NO recibe el socket de Docker directamente: quien tiene el socket es
  # administrador del host. Este proxy sólo deja pasar lo que DockerOperator necesita
  # (crear, arrancar, esperar, leer logs y borrar contenedores; consultar imágenes) y
  # niega todo lo demás: exec, build, redes, volúmenes, secretos, swarm.
  # Límite conocido: el proxy corta conexiones de más de 10 minutos, así que una tarea
  # que dure más fallaría. Hoy entrenar tarda ~2 min; si crece, se ajusta.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: ["airflow"]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1                  # para que cancelar una tarea detenga su contenedor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # Sin `ports`: sólo lo alcanzan los contenedores de la red de compose.

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow   # sólo alcanzable dentro de la red de compose
      POSTGRES_DB: airflow
    volumes: ["airflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Corre una vez y termina: migra la base y crea el usuario admin. El resto espera a
  # que termine bien (`service_completed_successfully`).
  airflow-init:
    <<: *airflow
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    # Con LocalExecutor las tareas corren aquí, y son las que hablan con el proxy.
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init: {condition: service_completed_successfully}
      docker-proxy: {condition: service_started}

  # Airflow 3 separa el parseo de DAGs en su propio proceso: un DAG con un error de
  # import ya no puede tumbar al scheduler.
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init: {condition: service_completed_successfully}

volumes:
  mlflow-data:                     # la base y los artefactos sobreviven a `down`
  datos:
    name: ml-predict-income-datos  # nombre fijo: los DAGs lo montan por este nombre
  crudos:
    name: ml-predict-income-crudos # microdatos de INEGI, sólo lectura para las tareas
  airflow-db:                      # metadatos de Airflow: corridas, historial, usuarios
  airflow-logs:                    # logs de cada tarea (se ven en la UI)
