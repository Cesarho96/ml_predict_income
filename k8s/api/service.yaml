# Un nombre y una IP estables delante de los pods de la API, que van y vienen.
# Reparte las peticiones entre los pods con la etiqueta app=api que estén READY
# (la readinessProbe decide quién entra en la lista).
#
# Tipo ClusterIP (el de omisión): sólo accesible desde dentro del cluster, como
# http://api (puerto 80). Para entrar desde tu máquina: `kubectl port-forward` (paso 4)
# y más adelante un Ingress/Gateway (paso 6).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80            # el puerto del Service
      targetPort: http    # el puerto con nombre "http" del contenedor (8000)
