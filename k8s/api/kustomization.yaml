# La lista de lo que forma la aplicación en Kubernetes, más ajustes comunes a todo.
#
#     kubectl kustomize k8s/api     # ver el YAML final, SIN aplicarlo
#     kubectl diff -k k8s/api       # qué cambiaría en el cluster
#     kubectl apply -k k8s/api      # aplicarlo
#
# Kustomize viene dentro de kubectl (-k).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Todo lo de abajo vive en este namespace (una "carpeta" dentro del cluster). Borrar el
# namespace borra la app entera sin tocar nada más del cluster.
namespace: ml-predict-income

resources:
  - namespace.yaml
  - mlflow.yaml
  - predicciones-db.yaml
  - config.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ruta.yaml
  - monitor.yaml
  - alertas.yaml

# El dashboard de Grafana como ConfigMap con la etiqueta que el sidecar de Grafana busca
# (k8s/cluster/monitoreo/values.yaml). Grafana lo carga solo; el JSON vive en git.
# Sin sufijo de hash: un nombre estable evita dashboards duplicados al cambiar el JSON.
configMapGenerator:
  - name: dashboard-api
    files:
      - dashboards/api.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

# QUÉ versión de la API corre en el cluster: una línea. Cambiarla y hacer `apply` es un
# despliegue; el tag es el commit (inmutable, igual que en ECR).
images:
  - name: ml-predict-income
    newTag: "7879b53"   # entre comillas: un sha como 1234567 o 12e4567 se leería como número
